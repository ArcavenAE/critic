id: elem-run-record-model
type: element
confidence: frontier
title: "critic's run record: one record per measured or indexed execution, of which a legion repository is one locus"
tags:
  - registry
  - arena
  - mvp
content: |
  Proposed 2026-10-14 in docs/design/critic-mvp.md (aae-orc-hp96). Not
  ratified.

  A run is one execution critic measures or indexes. That covers a factory
  session set on a test project (kind `trial`), a seed run, or a legion,
  spike or fork repository (the kinds in docs/run-marker-schema.md).
  The record extends the schema's field set, marker and Dolt layers, and
  does not replace it: every schema field and value keeps its meaning. The
  marker's `run_id` stays the cohort, `parent` becomes the first
  `derived-from` lineage edge, and the Dolt layer's `status`, `metrics` and
  `kos_finding` are kept unchanged. One field gains a value: `kind` adds
  `trial`, in the record only; a marker cannot carry it unless the schema
  adds it.

  Fields beyond the schema:
  - `id`: the run's unique, immutable key;
  - `factory_ref`: the factory's pins (pack version, upstream commit, pack
    digest);
  - `arm`: a free treatment label;
  - `block` and `order`: pair membership, beside the marker's `run_id`
    cohort;
  - `protocol_role`: smoke, live-test, seed, pilot, series, fidelity,
    reference, drill or defaults;
  - `parents`: the effective-lineage view of the edge rows, governed by
    elem-run-lineage;
  - `protocol_sha` and `harness_build`;
  - `locus`: a repository or checkout, with start and end commits;
  - `sessions` and `transcript_roots`;
  - start and end times;
  - `run_state`: started, completed, stalled, crashed, timed-out,
    limit-stopped or void, with `void_rule` naming the protocol rule that set
    void;
  - `host_class`: the role of the host, never its name;
  - `outcome`;
  - `ledger` and `cost` references, by path and sha256.

  Never in the record: transcript content, secret values or host names.
  Transcripts stay in the private runtime area (charter B2).

  Why one record: the two first consumers, the vsdd-factory team probe and
  the rc.22 against rc.24 side-by-side (aae-orc-17ki), are factory
  executions, not repositories. One shape with a free `arm` label serves
  both. A legion repository becomes the `legion` locus of the same record,
  so registry sync is added later without a second model.

  Store: Dolt stays the index of record (charter B3), in a `critic`
  database. Where that database lives is an open operator ruling (design
  section 9, R2).

  Valid until 2026-10-28, when the architect role re-checks it, or until R1
  is ruled, whichever comes first.
