[workspace]
resolver = "2"
members = ["crates/critic-core", "crates/critic-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false

[workspace.dependencies]
clap = { version = "4.6", features = ["derive"] }
mysql = { version = "28.0", default-features = false, features = ["minimal"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.11"
toml = "1.1"
tempfile = "3"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
